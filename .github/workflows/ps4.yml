name: PS4 release

on:
  push:
    branches: [port/ps4]
    tags: ['ps4-v*']
  pull_request:
    paths:
      - 'src/platform/ps4/**'
      - 'src/core/config.c'
      - 'src/feature/gui/gui-runner.c'
      - 'CMakeLists.txt'
      - 'build-ps4.sh'
      - '.github/workflows/ps4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OpenGNM test dependency
        run: git clone https://github.com/PS4-OpenGNM/opengnm.git ../opengnm
      - name: Configure host helpers
        run: cmake -S . -B build-ps4-host-tests -DBUILD_PS4_TESTS=ON -DOPENGNM_ROOT="$GITHUB_WORKSPACE/../opengnm"
      - name: Build and test host helpers
        run: cmake --build build-ps4-host-tests --parallel 2 && ctest --test-dir build-ps4-host-tests --output-on-failure

  package:
    runs-on: ubuntu-22.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned PS4 image
        run: docker build --platform linux/amd64 -f src/platform/ps4/Dockerfile -t mgba/ps4:ci .
      - name: Build PKG
        run: docker run --rm --platform linux/amd64 -v "$PWD:/home/mgba/src" -w /home/mgba/src mgba/ps4:ci ./build-ps4.sh pkg
      - name: Collect release files
        id: collect
        run: |
          set -euo pipefail
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          pkg=$(find build-ps4 -maxdepth 1 -name '*.pkg' -type f | head -n1)
          test -n "$pkg"
          cp "$pkg" "mgba-ps4-${SAFE_REF_NAME}.pkg"
          cp build-ps4/mgba-ps4.elf "mgba-ps4-${SAFE_REF_NAME}.elf"
          sha256sum mgba-ps4-${SAFE_REF_NAME}.pkg mgba-ps4-${SAFE_REF_NAME}.elf > SHA256SUMS
          printf 'OpenGNM and OpenOrbis sources are built in the pinned PS4 Docker image.\n' > THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-ps4-${{ github.sha }}
          path: |
            mgba-ps4-*.pkg
            mgba-ps4-*.elf
            SHA256SUMS
            THIRD_PARTY_NOTICES.txt

  release:
    if: startsWith(github.ref, 'refs/tags/ps4-v')
    runs-on: ubuntu-22.04
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mgba-ps4-*
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # mGBA for PlayStation 4

          This release contains the PS4 port of mGBA, a fast and accurate Game Boy Advance emulator.

          - Built with the pinned OpenGNM toolchain and PS4 packaging pipeline.
          - Includes the `.pkg` installer for PS4 distribution.
          - Attachments are checksummed in the included `SHA256SUMS` file.
          - Upload ROM files to `/data/mgba/roms` on your PS4 before launching.

          ## Contents
          - `mgba-ps4-*.pkg`
          - `SHA256SUMS`
          - `THIRD_PARTY_NOTICES.txt`
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "mGBA PS4 $GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --prerelease mgba-ps4-*.pkg SHA256SUMS THIRD_PARTY_NOTICES.txt
